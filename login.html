<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guardian - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-layout">
    <div class="auth-container">
      <!-- Logo -->
      <div class="auth-logo">
        <div class="logo-icon">🛡️</div>
        <h1>Guardian</h1>
        <p>Proteção digital para sua família</p>
      </div>

      <!-- Auth Card -->
      <div class="auth-card">
        <!-- Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Entrar</button>
          <button class="auth-tab" data-tab="register">Criar Conta</button>
        </div>

        <!-- Login Form -->
        <form class="auth-form" id="loginForm">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input 
              type="email" 
              id="loginEmail" 
              placeholder="seu@email.com" 
              autocomplete="email"
              required
            />
          </div>
          <div class="form-group">
            <label for="loginPassword">Senha</label>
            <input 
              type="password" 
              id="loginPassword" 
              placeholder="••••••" 
              autocomplete="current-password"
              required
            />
          </div>
          <p class="error-message" id="loginError"></p>
          <button type="submit" class="btn btn-primary btn-large btn-full" id="loginBtn">
            <span class="btn-icon">🔓</span>
            Entrar
          </button>
        </form>

        <!-- Register Form -->
        <form class="auth-form" id="registerForm" hidden>
          <div class="form-group">
            <label for="registerEmail">Email</label>
            <input 
              type="email" 
              id="registerEmail" 
              placeholder="seu@email.com" 
              autocomplete="email"
              required
            />
          </div>
          <div class="form-group">
            <label for="registerPassword">Senha</label>
            <input 
              type="password" 
              id="registerPassword" 
              placeholder="Mínimo 6 caracteres" 
              autocomplete="new-password"
              minlength="6"
              required
            />
          </div>
          <div class="form-group">
            <label for="registerPasswordConfirm">Confirmar Senha</label>
            <input 
              type="password" 
              id="registerPasswordConfirm" 
              placeholder="Repita a senha" 
              autocomplete="new-password"
              required
            />
          </div>
          <p class="error-message" id="registerError"></p>
          <button type="submit" class="btn btn-primary btn-large btn-full" id="registerBtn">
            <span class="btn-icon">📝</span>
            Criar Conta
          </button>
        </form>
      </div>

      <p style="text-align: center; margin-top: var(--space-lg); color: var(--text-secondary); font-size: 0.875rem;">
        Ao usar o Guardian, você concorda com nossos<br>
        <a href="#">Termos de Uso</a> e <a href="#">Política de Privacidade</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    const { $, $$, showToast } = GuardianUtils;
    const { auth } = GuardianAPI;

    // Redirect if already logged in
    if (auth.isAuthenticated()) {
      window.location.href = 'index.html';
    }

    // Tab switching
    $$('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const tabName = tab.dataset.tab;
        
        $$('.auth-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        $('#loginForm').hidden = tabName !== 'login';
        $('#registerForm').hidden = tabName !== 'register';
        
        // Clear errors
        $('#loginError').textContent = '';
        $('#registerError').textContent = '';
      });
    });

    // Login
    $('#loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = $('#loginEmail').value.trim();
      const password = $('#loginPassword').value;
      const errorEl = $('#loginError');
      const btn = $('#loginBtn');
      
      errorEl.textContent = '';
      btn.disabled = true;
      btn.innerHTML = '<span class="btn-icon">⏳</span> Entrando...';
      
      try {
        await auth.login(email, password);
        window.location.href = 'index.html';
      } catch (error) {
        errorEl.textContent = error.message;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span class="btn-icon">🔓</span> Entrar';
      }
    });

    // Register
    $('#registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = $('#registerEmail').value.trim();
      const password = $('#registerPassword').value;
      const passwordConfirm = $('#registerPasswordConfirm').value;
      const errorEl = $('#registerError');
      const btn = $('#registerBtn');
      
      errorEl.textContent = '';
      
      if (password !== passwordConfirm) {
        errorEl.textContent = 'As senhas não coincidem';
        return;
      }
      
      if (password.length < 6) {
        errorEl.textContent = 'A senha deve ter pelo menos 6 caracteres';
        return;
      }
      
      btn.disabled = true;
      btn.innerHTML = '<span class="btn-icon">⏳</span> Criando conta...';
      
      try {
        await auth.register(email, password);
        showToast('Conta criada com sucesso! Faça login.', 'success');
        
        // Switch to login tab
        $$('.auth-tab')[0].click();
        $('#loginEmail').value = email;
        
        // Clear register form
        $('#registerEmail').value = '';
        $('#registerPassword').value = '';
        $('#registerPasswordConfirm').value = '';
      } catch (error) {
        errorEl.textContent = error.message;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span class="btn-icon">📝</span> Criar Conta';
      }
    });
  </script>
</body>
</html>
